{% extends "layout.html" %}

{% block title %}
    Quote request
{% endblock %}

{% block main %}
    <form action="/quote" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="symbol" name="symbol" placeholder="Quote" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Submit request for quote</button>
    </form>
{% endblock %}
